<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <title>Hochzeitsrede</title>
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <div id="startscreen" onclick="startGame()"></div>
    <div id="selection">
        <p id="sentence"></p>
        <div id="answers">
            <div class="answer" onclick="setAnswer(0)">
                <div class="number">
                    <p>1</p>
                </div>
                <p></p>
            </div>
            <div class="answer" onclick="setAnswer(1)">
                <div class="number">
                    <p>2</p>
                </div>
                <p></p>
            </div>
            <div class="answer" onclick="setAnswer(2)">
                <div class="number">
                    <p>3</p>
                </div>
                <p></p>
            </div>
            <div class="answer" onclick="setAnswer(3)">
                <div class="number">
                    <p>4</p>
                </div>
                <p></p>
            </div>
            <div class="answer" onclick="setAnswer(4)">
                <div class="number">
                    <p>5</p>
                </div>
                <p></p>
            </div>
            <div class="answer" onclick="setAnswer(5)">
                <div class="number">
                    <p>6</p>
                </div>
                <p></p>
            </div>
        </div>
    </div>

    <div id="result">
        <p class="result-sentence"></p>
        <p class="result-sentence"></p>
        <p class="result-sentence"></p>
        <p class="result-sentence"></p>
        <p class="result-sentence"></p>
        <p class="result-sentence"></p>
        <p class="result-sentence"></p>
        <p class="result-sentence"></p>
    </div>

    <script src="main.js" type="text/javascript"></script>
</body>
