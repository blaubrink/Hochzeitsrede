<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <title>Hochzeitsrede</title>
    <style>
        @font-face {
            font-family: "Inter-Bold";
            src: url("Inter-Bold.ttf") format("truetype");
        }

        * {
            margin: 0;
            padding: 0;
            border: none;
            box-sizing: border-box;
            text-decoration: none;
        }

        body {
            overflow: hidden;
            user-select: none;
        }

        #wrapper {
            width: 1536px;
            height: 864px;
            /*background-color: black;*/
            background-color: white;
            padding: 3rem;
            transform-origin: top left;
            position: absolute;
            top: 0;
            left: 0;
        }

        /*#startscreen {
    width: 100%;
    height: 100%;
}

#selection {
    display: none;
}*/

        #sentence {
            height: 160px;
            margin: 2rem 0 8rem 0;
            font-family: "Inter-Bold", sans-serif;
            color: black;
            font-size: 48px;
            line-height: 1.5;
        }

        #answers {
            width: 100%;
            display: flex;
            justify-content: space-between;
            flex-flow: row wrap;
            row-gap: 3rem;
        }

        .answer {
            position: relative;
            width: 30%;
            height: 200px;
            border-radius: 32px;
            box-shadow: 2px 2px 4px black;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            cursor: pointer;
        }

        .number {
            position: absolute;
            top: -32px;
            left: -32px;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 2px 2px 4px black;
            background-color: white;
        }

        .number>p {
            font-family: "Inter-Bold", sans-serif;
            color: black;
            font-size: 24px;
        }

        .answer>p {
            font-family: "Inter-Bold", sans-serif;
            color: black;
            font-size: 36px;
        }

        #result {
            display: none;
        }

        .result-sentence {
            margin-bottom: 1rem;
            font-family: "Inter-Bold", sans-serif;
            color: black;
            font-size: 42px;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <div id="wrapper">
        <!--<div id="startscreen" onclick="startGame()"></div>-->
        <div id="selection">
            <p id="sentence"></p>
            <div id="answers">
                <div class="answer" onclick="setAnswer(0)">
                    <div class="number">
                        <p>1</p>
                    </div>
                    <p></p>
                </div>
                <div class="answer" onclick="setAnswer(1)">
                    <div class="number">
                        <p>2</p>
                    </div>
                    <p></p>
                </div>
                <div class="answer" onclick="setAnswer(2)">
                    <div class="number">
                        <p>3</p>
                    </div>
                    <p></p>
                </div>
                <div class="answer" onclick="setAnswer(3)">
                    <div class="number">
                        <p>4</p>
                    </div>
                    <p></p>
                </div>
                <div class="answer" onclick="setAnswer(4)">
                    <div class="number">
                        <p>5</p>
                    </div>
                    <p></p>
                </div>
                <div class="answer" onclick="setAnswer(5)">
                    <div class="number">
                        <p>6</p>
                    </div>
                    <p></p>
                </div>
            </div>
        </div>

        <div id="result">
            <p class="result-sentence"></p>
            <p class="result-sentence"></p>
            <p class="result-sentence"></p>
            <p class="result-sentence"></p>
            <p class="result-sentence"></p>
            <p class="result-sentence"></p>
            <p class="result-sentence"></p>
            <p class="result-sentence"></p>
        </div>

        <script>
            const sentences = [
                ["Liebe(r/s) ", ","],
                ["Ich habe die Ehre, euch ", " zu wünschen."],
                ["Als ", " geschah, wusste ich, dass ihr füreinander bestimmt seid."],
                ["Wenn ich an Friederike denke, denke ich an ", "."],
                ["Wenn ich an Merlin denke, denke ich an ", "."],
                ["", " muss euch nicht peinlich sein."],
                ["Behaltet euer/eure(n) ", " immer bei!"],
                ["Euer/Eure ", "."]
            ];

            const possibleAnswers = [
                "Friederike",
                "Merlin",
                "Brautpaar",
                "Familie",
                "Schwester",
                "Gemeinschaft",
                "Jesus",
                "Liebe",
                "Freunde",
                "Italien",
                "Urlaub",
                "Glück",
                "zu viel Alkohol",
                "Grillen",
                "Intelligenz",
                "Sohn von Wolfgang Petri",
                "gemeinsame Zeit",
                "Playstation",
                "Pizza zum Mitnehmen",
                "Feminismus",
                "Herne-West",
                "Corona",
                "Jonas",
                "keine Rücksicht auf Verluste",
                "Faulheit",
                "edle Tropfen",
                "Verkehr",
                "offensiv ausgelebte Ahnungslosigkeit",
                "blindes Vertrauen",
                "nicht viel",
                "zu viel",
                "die Sprache der Tiere",
                "Don Papa",
                "Siesta bis 8 Uhr abends",
                "Deutschrap in Dauerschleife",
                "deine Mutter",
                "Kinder",
                "Katzen",
                "Vegetarier",
                "Diskussionen bis spät in die Nacht",
                "Eier",
                "realistische Erwartungen",
                "Gutscheine ohne Verfallsdatum",
                "ein halbvolles Bier",
                "gesunder Menschenverstand",
                "Hugo, der Boss",
                "eine plötzliche Veränderung",
                "ein verdammt schwerer Kühlschrank",
            ];

            const selectedAnswers = [
                "________",
                "________",
                "________",
                "________",
                "________",
                "________",
                "________",
                "________"
            ];

            let round = 0;

            const elWrapper = document.querySelector("#wrapper");
            const elStartscreen = document.querySelector("#startscreen");
            const elSelection = document.querySelector("#selection");
            const elResult = document.querySelector("#result");
            const elSentence = document.querySelector("#sentence");
            const elAnswerContents = document.querySelectorAll(".answer > p");
            const elResultSentences = document.querySelectorAll(".result-sentence");

            elWrapper.style.transform = `scale(${window.innerHeight / 864})`;
            console.log(window.innerHeight);

            /*function startGame() {
                elWrapper.style.backgroundColor = "white";
                elStartscreen.style.display = "none";
                elSelection.style.display = "block";
            }*/

            function setNewSentence() {
                elSentence.innerHTML = sentences[round][0] + selectedAnswers[round] + sentences[round][1];

                const answers = returnAnswers();
                for (let i = 0; i < elAnswerContents.length; i++) {
                    if (answers[i] === "ein halbvolles Bier" && (round === 0 || round === 6 || round === 7)) {
                        answers[i] = "halbvolles Bier";
                    } else if (answers[i] === "gesunder Menschenverstand" && (round === 1 || round === 3 || round === 4 || round === 6)) {
                        answers[i] = "gesunden Menschenverstand";
                    } else if (answers[i] === "Hugo, der Boss" && (round === 1 || round === 3 || round === 4 || round === 6)) {
                        answers[i] = "Hugo, den Boss";
                    } else if (answers[i] === "eine plötzliche Veränderung" && (round === 0 || round === 6 || round === 7)) {
                        answers[i] = "plötzliche Veränderung"
                    } else if (answers[i] === "ein verdammt schwerer Kühlschrank") {
                        if (round === 0 || round === 7) {
                            answers[i] = "verdammt schwerer Kühlschrank";
                        } else if (round === 6) {
                            answers[i] = "verdammt schweren Kühlschrank";
                        } else if (round === 1 || round === 3 || round === 4) {
                            answers[i] = "einen verdammt schweren Kühlschrank";
                        }
                    } else if (answers[i] === "die Sprache der Tiere" && (round === 0 || round === 6 || round === 7)) {
                        answers[i] = "Sprache der Tiere";
                    } else if (answers[i] === "realistische Erwartungen" && (round === 6 || round === 7)) {
                        answers[i] = "realistischen Erwartungen";
                    }

                    if (round === 5) {
                        answers[i] = answers[i].charAt(0).toUpperCase() + answers[i].slice(1);
                    }

                    elAnswerContents[i].innerHTML = answers[i];
                }
            }

            function returnAnswers() {
                const answers = [];
                for (let i = 0; i < 6; i++) {
                    const r = Math.floor(Math.random() * possibleAnswers.length);
                    answers.push(possibleAnswers[r]);
                    possibleAnswers.splice(r, 1);
                }
                return answers;
            }

            function setAnswer(number) {
                selectedAnswers[round] = elAnswerContents[number].innerHTML;
                round++;
                if (round < 8) {
                    setNewSentence();
                } else {
                    for (let i = 0; i < elResultSentences.length; i++) {
                        if (selectedAnswers[i] === "Kinder" ||
                            selectedAnswers[i] === "Katzen" ||
                            selectedAnswers[i] === "Vegetarier" ||
                            selectedAnswers[i] === "Diskussionen bis spät in die Nacht" ||
                            selectedAnswers[i] === "Realistische Erwartungen" ||
                            selectedAnswers[i] === "Eier" ||
                            selectedAnswers[i] === "Gutscheine ohne Verfallsdatum" ||
                            selectedAnswers[i] === "Freunde" ||
                            selectedAnswers[i] === "edle Tropfen" ||
                            selectedAnswers[i] === "Edle Tropfen") {
                            if (i === 2) {
                                sentences[i][1] = " geschahen, wusste ich, dass ihr füreinander bestimmt seid.";
                            } else if (i === 5) {
                                sentences[i][1] = " müssen euch nicht peinlich sein.";
                            }
                        }
                        if (selectedAnswers[i] === "Friederike" ||
                            selectedAnswers[i] === "Familie" ||
                            selectedAnswers[i] === "Schwester" ||
                            selectedAnswers[i] === "Gemeinschaft" ||
                            selectedAnswers[i] === "Liebe" ||
                            selectedAnswers[i] === "Freunde" ||
                            selectedAnswers[i] === "Intelligenz" ||
                            selectedAnswers[i] === "gemeinsame Zeit" ||
                            selectedAnswers[i] === "Playstation" ||
                            selectedAnswers[i] === "Pizza zum Mitnehmen" ||
                            selectedAnswers[i] === "keine Rücksicht auf Verluste" ||
                            selectedAnswers[i] === "Faulheit" ||
                            selectedAnswers[i] === "edle Tropfen" ||
                            selectedAnswers[i] === "offensiv ausgelebte Ahnungslosigkeit" ||
                            selectedAnswers[i] === "Sprache der Tiere" ||
                            selectedAnswers[i] === "Siesta bis 8 Uhr abends" ||
                            selectedAnswers[i] === "deine Mutter" ||
                            selectedAnswers[i] === "Kinder" ||
                            selectedAnswers[i] === "Vegetarier" ||
                            selectedAnswers[i] === "Diskussionen bis spät in die Nacht" ||
                            selectedAnswers[i] === "Eier" ||
                            selectedAnswers[i] === "realistische Erwartungen" ||
                            selectedAnswers[i] === "realistischen Erwartungen" ||
                            selectedAnswers[i] === "Gutscheine ohne Verfallsdatum" ||
                            selectedAnswers[i] === "plötzliche Veränderung") {
                            if (i === 0) {
                                sentences[i][0] = "Liebe ";
                            } else if (i === 6) {
                                sentences[i][0] = "Behaltet eure "
                            } else if (i === 7) {
                                sentences[i][0] = "Eure "
                            }
                        } else if (selectedAnswers[i] === "Merlin" ||
                            selectedAnswers[i] === "Jesus" ||
                            selectedAnswers[i] === "Urlaub" ||
                            selectedAnswers[i] === "zu viel Alkohol" ||
                            selectedAnswers[i] === "Sohn von Wolfgang Petri" ||
                            selectedAnswers[i] === "Feminismus" ||
                            selectedAnswers[i] === "Jonas" ||
                            selectedAnswers[i] === "Verkehr" ||
                            selectedAnswers[i] === "Don Papa" ||
                            selectedAnswers[i] === "Deutschrap in Dauerschleife" ||
                            selectedAnswers[i] === "gesunder Menschenverstand" ||
                            selectedAnswers[i] === "gesunden Menschenverstand" ||
                            selectedAnswers[i] === "Hugo, der Boss" ||
                            selectedAnswers[i] === "Hugo, den Boss" ||
                            selectedAnswers[i] === "verdammt schwerer Kühlschrank" ||
                            selectedAnswers[i] === "verdammt schweren Kühlschrank") {
                            if (i === 0) {
                                sentences[i][0] = "Lieber ";
                            } else if (i === 6) {
                                sentences[i][0] = "Behaltet euren "
                            } else if (i === 7) {
                                sentences[i][0] = "Euer "
                            }
                        } else if (selectedAnswers[i] === "Brautpaar" ||
                            selectedAnswers[i] === "Italien" ||
                            selectedAnswers[i] === "Glück" ||
                            selectedAnswers[i] === "Grillen" ||
                            selectedAnswers[i] === "Herne-West" ||
                            selectedAnswers[i] === "Corona" ||
                            selectedAnswers[i] === "blindes Vertrauen" ||
                            selectedAnswers[i] === "nicht viel" ||
                            selectedAnswers[i] === "zu viel" ||
                            selectedAnswers[i] === "halbvolles Bier") {
                            if (i === 0) {
                                sentences[i][0] = "Liebes ";
                            } else if (i === 6) {
                                sentences[i][0] = "Behaltet euer "
                            } else if (i === 7) {
                                sentences[i][0] = "Euer "
                            }
                        }

                        elResultSentences[i].innerHTML = sentences[i][0] + selectedAnswers[i] + sentences[i][1];
                    }

                    elSelection.style.display = "none";
                    elResult.style.display = "block";
                }
            }

            setNewSentence();
        </script>
    </div>
</body>
