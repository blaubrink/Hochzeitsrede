<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <title>Hochzeitsrede</title>
    <style>
        @font-face {
            font-family: "Inter-Bold";
            src: url("Inter-Bold.ttf") format("truetype");
        }

        * {
            margin: 0;
            padding: 0;
            border: none;
            box-sizing: border-box;
            text-decoration: none;
        }

        body {
            overflow: hidden;
            user-select: none;
        }

        #wrapper {
            width: 100vw;
            height: 100vh;
            background-color: white;
            padding: 3rem;
            transform-origin: top left;
            position: absolute;
            top: 0;
            left: 0;
        }

        #startscreen {
            width: 100%;
            height: 100%;
        }

        #selection {
            display: none;
        }

        #sentence {
            height: 160px;
            margin: 2rem 0 8rem 0;
            font-family: "Inter-Bold", sans-serif;
            color: black;
            font-size: 48px;
            line-height: 1.5;
        }

        #answers {
            width: 100%;
            display: flex;
            justify-content: space-between;
            flex-flow: row wrap;
            row-gap: 3rem;
        }

        .answer {
            position: relative;
            width: 30%;
            height: 200px;
            border-radius: 32px;
            box-shadow: 2px 2px 4px black;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            cursor: pointer;
        }

        .number {
            position: absolute;
            top: -32px;
            left: -32px;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 2px 2px 4px black;
            background-color: white;
        }

        .number>p {
            font-family: "Inter-Bold", sans-serif;
            color: black;
            font-size: 24px;
        }

        .answer>p {
            font-family: "Inter-Bold", sans-serif;
            color: black;
            font-size: 36px;
        }

        #result {
            display: none;
        }

        .result-sentence {
            margin-bottom: 1rem;
            font-family: "Inter-Bold", sans-serif;
            color: black;
            font-size: 42px;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <div id="wrapper">
        <div id="startscreen" onclick="startGame()"></div>
        <div id="selection">
            <p id="sentence"></p>
            <div id="answers">
                <div class="answer" onclick="setAnswer(0)">
                    <div class="number">
                        <p>1</p>
                    </div>
                    <p></p>
                </div>
                <div class="answer" onclick="setAnswer(1)">
                    <div class="number">
                        <p>2</p>
                    </div>
                    <p></p>
                </div>
                <div class="answer" onclick="setAnswer(2)">
                    <div class="number">
                        <p>3</p>
                    </div>
                    <p></p>
                </div>
                <div class="answer" onclick="setAnswer(3)">
                    <div class="number">
                        <p>4</p>
                    </div>
                    <p></p>
                </div>
                <div class="answer" onclick="setAnswer(4)">
                    <div class="number">
                        <p>5</p>
                    </div>
                    <p></p>
                </div>
                <div class="answer" onclick="setAnswer(5)">
                    <div class="number">
                        <p>6</p>
                    </div>
                    <p></p>
                </div>
            </div>
        </div>

        <div id="result">
            <p class="result-sentence"></p>
            <p class="result-sentence"></p>
            <p class="result-sentence"></p>
            <p class="result-sentence"></p>
            <p class="result-sentence"></p>
            <p class="result-sentence"></p>
            <p class="result-sentence"></p>
            <p class="result-sentence"></p>
        </div>

        <script>
            const sentences = [
                ["Liebe(r/s) ", ","],
                ["Ich habe die Ehre, euch ", " zu wünschen."],
                ["Als ", " geschah, wusste ich, dass ihr füreinander bestimmt seid."],
                ["Wenn ich an Jana denke, denke ich an ", "."],
                ["Wenn ich an Fabian denke, denke ich an ", "."],
                ["", " muss euch nicht peinlich sein."],
                ["Behaltet euer/eure(n) ", " immer bei!"],
                ["Euer/Eure ", "."]
            ];

            const possibleAnswers = [
                "Jana",
                "Fabian",
                "Brautpaar",
                "Familie",
                "Gemeinschaft",
                "Jesus",
                "Liebe",
                "Freunde",
                "Urlaub",
                "Glück",
                "zu viel Alkohol",
                "Grillen",
                "Intelligenz",
                "Idefix",
                "gemeinsame Zeit",
                "Osterfeuer",
                "Nino mit dem langen Hals",
                "Springe",
                "Arschloch ohne Ende",
                "Herr Dr. Rohde",
                "keine Rücksicht auf Verluste",
                "Gurkenkrokodil",
                "Verkehr",
                "offensiv ausgelebte Gemütlichkeit",
                "blindes Vertrauen",
                "nicht viel",
                "zu viel",
                "die Sprache der Tiere",
                "Heinrich Göbel",
                "Björn, Niklas, Chris und Lauritz",
                "Schierker Feuerstein",
                "deine Mutter",
                "Kinder",
                "Scrum Master",
                "Frösche und Pinguine",
                "Eier",
                "realistische Erwartungen",
                "ein halbvolles Bier",
                "gesunder Menschenverstand",
                "schlechte Musik",
                "eine plötzliche Veränderung",
                "letzte Nacht im DRK Springe",
                "Money, Money, Money",
                "Dancing Queen",
                "Spieleabend",
                "Hippies",
                "Südtirol",
                "Silvester"
            ];

            const selectedAnswers = [
                "________",
                "________",
                "________",
                "________",
                "________",
                "________",
                "________",
                "________"
            ];

            let round = 0;

            const elStartscreen = document.querySelector("#startscreen");
            const elSelection = document.querySelector("#selection");
            const elResult = document.querySelector("#result");
            const elSentence = document.querySelector("#sentence");
            const elAnswerContents = document.querySelectorAll(".answer > p");
            const elResultSentences = document.querySelectorAll(".result-sentence");

            function startGame() {
                elStartscreen.style.display = "none";
                elSelection.style.display = "block";
            }

            function setNewSentence() {
                elSentence.innerHTML = sentences[round][0] + selectedAnswers[round] + sentences[round][1];

                const answers = returnAnswers();
                for (let i = 0; i < elAnswerContents.length; i++) {
                    if (answers[i] === "Herr Dr. Rohde" && (round === 1 || round === 3 || round === 4 || round === 6)) {
                        answers[i] = "Herrn Dr. Rohde"
                    } else if (answers[i] === "die Sprache der Tiere" && (round === 0 || round === 6 || round === 7)) {
                        answers[i] = "Sprache der Tiere";
                    } else if (answers[i] === "ein halbvolles Bier" && (round === 0 || round === 6 || round === 7)) {
                        answers[i] = "halbvolles Bier";
                    } else if (answers[i] === "gesunder Menschenverstand" && (round === 1 || round === 3 || round === 4 || round === 6)) {
                        answers[i] = "gesunden Menschenverstand";
                    }  else if (answers[i] === "eine plötzliche Veränderung" && (round === 0 || round === 6 || round === 7)) {
                        answers[i] = "plötzliche Veränderung"
                    } else if (answers[i] === "realistische Erwartungen" && (round === 6 || round === 7)) {
                        answers[i] = "realistischen Erwartungen";
                    }

                    if (round === 5) {
                        answers[i] = answers[i].charAt(0).toUpperCase() + answers[i].slice(1);
                    }

                    elAnswerContents[i].innerHTML = answers[i];
                }
            }

            function returnAnswers() {
                const answers = [];
                for (let i = 0; i < 6; i++) {
                    const r = Math.floor(Math.random() * possibleAnswers.length);
                    answers.push(possibleAnswers[r]);
                    possibleAnswers.splice(r, 1);
                }
                return answers;
            }

            function setAnswer(number) {
                selectedAnswers[round] = elAnswerContents[number].innerHTML;
                round++;
                if (round < 8) {
                    setNewSentence();
                } else {
                    for (let i = 0; i < elResultSentences.length; i++) {
                        if (selectedAnswers[i] === "Freunde" ||
                            selectedAnswers[i] === "Björn, Niklas, Chris und Lauritz" ||
                            selectedAnswers[i] === "Kinder" ||
                            selectedAnswers[i] === "Frösche und Pinguine" ||
                            selectedAnswers[i] === "Eier" ||
                            selectedAnswers[i] === "realistische Erwartungen" ||
                            selectedAnswers[i] === "Realistische Erwartungen" ||
                            selectedAnswers[i] === "Hippies") {
                            if (i === 2) {
                                sentences[i][1] = " geschahen, wusste ich, dass ihr füreinander bestimmt seid.";
                            } else if (i === 5) {
                                sentences[i][1] = " müssen euch nicht peinlich sein.";
                            }
                        }
                        if (selectedAnswers[i] === "Jana" ||
                            selectedAnswers[i] === "Familie" ||
                            selectedAnswers[i] === "Gemeinschaft" ||
                            selectedAnswers[i] === "Liebe" ||
                            selectedAnswers[i] === "Freunde" ||
                            selectedAnswers[i] === "Intelligenz" ||
                            selectedAnswers[i] === "gemeinsame Zeit" ||
                            selectedAnswers[i] === "keine Rücksicht auf Verluste" ||
                            selectedAnswers[i] === "offensiv ausgelebte Gemütlichkeit" ||
                            selectedAnswers[i] === "Sprache der Tiere" ||
                            selectedAnswers[i] === "deine Mutter" ||
                            selectedAnswers[i] === "Kinder" ||
                            selectedAnswers[i] === "Frösche und Pinguine" ||
                            selectedAnswers[i] === "Eier" ||
                            selectedAnswers[i] === "realistische Erwartungen" ||
                            selectedAnswers[i] === "realistischen Erwartungen" ||
                            selectedAnswers[i] === "schlechte Musik" ||
                            selectedAnswers[i] === "plötzliche Veränderung" ||
                            selectedAnswers[i] === "letzte Nacht im DRK Springe" ||
                            selectedAnswers[i] === "Dancing Queen" ||
                            selectedAnswers[i] === "Hippies") {
                            if (i === 0) {
                                sentences[i][0] = "Liebe ";
                            } else if (i === 6) {
                                sentences[i][0] = "Behaltet eure "
                            } else if (i === 7) {
                                sentences[i][0] = "Eure "
                            }
                        } else if (selectedAnswers[i] === "Fabian" ||
                            selectedAnswers[i] === "Jesus" ||
                            selectedAnswers[i] === "Urlaub" ||
                            selectedAnswers[i] === "zu viel Alkohol" ||
                            selectedAnswers[i] === "Idefix" ||
                            selectedAnswers[i] === "Nino mit dem langen Hals" ||
                            selectedAnswers[i] === "Herr Dr. Rohde" ||
                            selectedAnswers[i] === "Herrn Dr. Rohde" ||
                            selectedAnswers[i] === "Verkehr" ||
                            selectedAnswers[i] === "Heinrich Göbel" ||
                            selectedAnswers[i] === "Björn, Niklas, Chris und Lauritz" ||
                            selectedAnswers[i] === "Schierker Feuerstein" ||
                            selectedAnswers[i] === "Scrum Master" ||
                            selectedAnswers[i] === "gesunder Menschenverstand" ||
                            selectedAnswers[i] === "gesunden Menschenverstand" ||
                            selectedAnswers[i] === "Spieleabend") {
                            if (i === 0) {
                                sentences[i][0] = "Lieber ";
                            } else if (i === 6) {
                                sentences[i][0] = "Behaltet euren "
                            } else if (i === 7) {
                                sentences[i][0] = "Euer "
                            }
                        } else if (selectedAnswers[i] === "Brautpaar" ||
                            selectedAnswers[i] === "Glück" ||
                            selectedAnswers[i] === "Grillen" ||
                            selectedAnswers[i] === "Osterfeuer" ||
                            selectedAnswers[i] === "Springe" ||
                            selectedAnswers[i] === "Arschloch ohne Ende" ||
                            selectedAnswers[i] === "Gurkenkrokodil" ||
                            selectedAnswers[i] === "blindes Vertrauen" ||
                            selectedAnswers[i] === "nicht viel" ||
                            selectedAnswers[i] === "zu viel" ||
                            selectedAnswers[i] === "halbvolles Bier" ||
                            selectedAnswers[i] === "Money, Money, Money"||
                            selectedAnswers[i] === "Südtirol" ||
                            selectedAnswers[i] === "Silvester") {
                            if (i === 0) {
                                sentences[i][0] = "Liebes ";
                            } else if (i === 6) {
                                sentences[i][0] = "Behaltet euer "
                            } else if (i === 7) {
                                sentences[i][0] = "Euer "
                            }
                        }

                        elResultSentences[i].innerHTML = sentences[i][0] + selectedAnswers[i] + sentences[i][1];
                    }

                    elSelection.style.display = "none";
                    elResult.style.display = "block";
                }
            }

            setNewSentence();
        </script>
    </div>
</body>
